name: October visual evidence
on:
  push:
    branches: [review/october-visual-evidence]
    paths: [.github/workflows/october-evidence.yml]
permissions:
  contents: write
  actions: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: october-walk-review
          run-id: 37125163774
          github-token: ${{ github.token }}
          path: /tmp/october-recorded
      - run: python3 -m pip install Pillow==11.3.0
      - name: Assemble recorded before and after states, not generated images
        run: |
          python3 - <<'PY'
          import pathlib, json, hashlib
          from PIL import Image, ImageDraw, ImageChops
          root = pathlib.Path('/tmp/october-recorded/october-review')
          out = pathlib.Path('docs/october-evidence'); out.mkdir(parents=True, exist_ok=True)
          checks = []
          for device in ('desktop', 'phone'):
              index = json.loads((root/device/'review-index.json').read_text())
              assert index['revision'] == '315e5bc926f93866903264e8cd5f12e0184dbdd0'
              assert index['captureComplete'] and index['capturedCount'] == 8
              for zoom in ('normal', 'zoom'):
                  width, height = (600, 375) if zoom == 'normal' and device == 'desktop' else (390, 450)
                  if zoom == 'zoom' and device == 'desktop': width, height = 600, 450
                  sheet = Image.new('RGB', (width*2, (height+24)*4), 'white')
                  draw = ImageDraw.Draw(sheet)
                  for i, item in enumerate(index['placements']):
                      images = [Image.open(root/device/item['files'][zoom+'-'+state]).convert('RGB') for state in ('unfound','found')]
                      same = images[0].tobytes() == images[1].tobytes()
                      checks.append({'device':device, 'object':item['objectId'], 'state':zoom, 'beforeAfterPixelIdentical':same})
                      im = images[0]
                      im.thumbnail((width,height))
                      x,y=(i%2)*width,(i//2)*(height+24)
                      draw.text((x+4,y+5), item['objectId']+' / '+zoom, fill='black')
                      sheet.paste(im,(x+(width-im.width)//2,y+24))
                      if zoom == 'zoom':
                          pair=Image.new('RGB',(images[0].width*2,images[0].height+24),'white')
                          pd=ImageDraw.Draw(pair);pd.text((5,5),'BEFORE',fill='black');pd.text((images[0].width+5,5),'AFTER',fill='black')
                          pair.paste(images[0],(0,24));pair.paste(images[1],(images[0].width,24))
                          pair.save(out/f'{device}-{item["objectId"]}-pair.jpg',quality=92)
                  sheet.save(out/f'{device}-{zoom}.jpg',quality=92)
          (out/'evidence.json').write_text(json.dumps({'run':37125163774,'revision':'315e5bc926f93866903264e8cd5f12e0184dbdd0','note':'Contact sheets of actual screenshots; no source video, audio, metadata or font files. Navigation target positions changed later; organism placement coordinates did not. This is review evidence, not independent acceptance.','comparisons':checks},ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(checks))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/october-evidence
          git commit -m 'docs: record eight corrected placements before and after discovery'
          git push origin HEAD:review/october-visual-evidence
