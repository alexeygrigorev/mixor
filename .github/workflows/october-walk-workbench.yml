name: October walk workbench
on:
  push:
    branches: [feature/october-forest-walk]
    paths: [.github/workflows/october-walk-workbench.yml]
permissions:
  contents: write
  issues: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/october-forest-walk
      - name: Import the checksum-pinned public scene
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/alexeygrigorev/mixor/issues/comments/5969323338 > /tmp/scene-transfer.json
          python3 - <<'PY'
          import json, re, io, zipfile, hashlib, urllib.parse, pathlib, stat, subprocess
          comment = json.load(open('/tmp/scene-transfer.json'))
          assert comment['user']['login'] == 'alexeygrigorev'
          package = json.loads(re.search(r'```json\s*(.*?)\s*```', comment['body'], re.S).group(1))
          expected = '19ea4428b1ae8b42c012a2624cc46b98904de55cb81c02d16d2a14c8b390703e'
          assert package['sha256'] == expected
          url = urllib.parse.urlsplit(package['url'])
          assert url.scheme == 'https' and url.hostname.endswith('.oaiusercontent.com')
          subprocess.run(['curl', '--fail', '--silent', '--show-error', '--location', '--max-time', '90', '--output', '/tmp/public-scene.zip', '--config', '-'], input='url = ' + json.dumps(package['url']) + '\n', text=True, check=True)
          data = pathlib.Path('/tmp/public-scene.zip').read_bytes()
          assert len(data) == 19093037 and hashlib.sha256(data).hexdigest() == expected
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              assert len(archive.infolist()) == 72
              for item in archive.infolist():
                  p = pathlib.PurePosixPath(item.filename)
                  assert not p.is_absolute() and '..' not in p.parts
                  assert p.parts[0] in ('src', 'scripts', 'content', 'tests', 'public')
                  if p.parts[0] == 'public':
                      assert item.filename.startswith('public/assets/scene-08/') and p.suffix == '.webp'
                  assert not stat.S_ISLNK(item.external_attr >> 16) and item.file_size < 2000000
              archive.extractall('.')
          print('Imported 28 approved forest frames, thumbnails and implementation; checksum verified.')
          PY
          rm /tmp/scene-transfer.json /tmp/public-scene.zip
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src scripts content tests public/assets/scene-08
          git commit -m 'feat: add 28-frame October forest walk with reversible routes'
          git push origin HEAD:feature/october-forest-walk
          gh api --method PATCH repos/alexeygrigorev/mixor/issues/comments/5969323338 -f body='The approved public scene package has been imported and its SHA-256 verified. The temporary transfer link has been removed. No source video, audio or metadata was transferred.' >/dev/null
