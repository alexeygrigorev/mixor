name: October walk workbench
on:
  push:
    branches: [feature/october-forest-walk]
    paths: [.github/workflows/october-walk-workbench.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run typecheck && npm run test:photo-walk && npm run build
      - name: Archive locked dependencies for isolated local review
        run: tar -czf /tmp/mixor-dependencies.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: october-walk-dependencies
          path: /tmp/mixor-dependencies.tar.gz
          retention-days: 1
