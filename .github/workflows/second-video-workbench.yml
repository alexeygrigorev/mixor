name: Pine arrow correction review
on:
  push:
    branches: [workbench/second-video-walk]
permissions:
  contents: read
concurrency:
  group: pine-arrow-correction
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm run assets:validate && npm run test:photo-walk && npm run build
      - run: npx playwright install --with-deps chromium webkit
      - name: Capture the corrected arrow and full-height default views
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/pine-vite.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4173 >/dev/null && break; sleep 1; done
          VIEW_PREFIX=pine-19 OUTPUT_DIR=tmp/pine-correction/desktop node scripts/capture-photo-walk-placements.mjs
          VIEW_PREFIX=pine-19 VIEWPORT_WIDTH=390 VIEWPORT_HEIGHT=844 OUTPUT_DIR=tmp/pine-correction/phone node scripts/capture-photo-walk-placements.mjs
          node --input-type=module <<'JS'
          import { chromium } from '@playwright/test';
          import { mkdir } from 'node:fs/promises';
          const browser = await chromium.launch();
          for (const viewport of [{width:390,height:844},{width:1440,height:900}]) {
            const dir = `tmp/pine-correction/default-${viewport.width}`;
            await mkdir(dir,{recursive:true});
            for (const id of ['pine-01','pine-09','pine-16','pine-19','pine-28','pine-33','pine-34','pine-36']) {
              const context = await browser.newContext({viewport,reducedMotion:'reduce'});
              const page = await context.newPage();
              await page.addInitScript(()=>{localStorage.setItem('mixor-entered-v2','true');localStorage.setItem('mixor-muted','true');});
              await page.goto(`http://127.0.0.1:4173/#world/physarum/${id}`);
              await page.locator(`.photo-walk-scene[data-view="${id}"][data-busy="false"]`).waitFor();
              await page.evaluate(async()=>{await document.fonts.ready;await Promise.all([...document.images].map(i=>i.decode()));});
              await page.screenshot({path:`${dir}/${id}.png`});
              await context.close();
            }
          }
          await browser.close();
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pine-arrow-correction
          path: tmp/pine-correction/
          retention-days: 7
      - name: Chromium complete pine traversal and 320px hit targets
        run: npx playwright test tests/browser/photo-walk-pine*.spec.ts
      - name: WebKit complete pine traversal and 320px hit targets
        if: always()
        run: npx playwright test --config playwright.webkit.config.ts tests/browser/photo-walk-pine*.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pine-correction-browser
          path: |
            tmp/**/*.png
            tmp/**/review-index.json
            tmp/**/error-context.md
          retention-days: 7
