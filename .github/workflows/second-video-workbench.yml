name: Final pine route review
on:
  push:
    branches: [workbench/second-video-walk]
permissions:
  contents: read
concurrency:
  group: final-pine-review
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1ba2bc591b8329e3c451d6c859b34cd411d6d213
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm run assets:validate && node --test tests/domain.test.mjs tests/content.test.mjs tests/photo-walk.test.mjs tests/photo-walk-progress.test.mjs tests/photo-walk-camera.test.mjs && npm run build
      - run: npx playwright install --with-deps chromium webkit
      - name: Record corrected cross-walk arrow at desktop and 320px
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/pine-vite.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4173 >/dev/null && break; sleep 1; done
          VIEW_PREFIX=october-28 OUTPUT_DIR=tmp/pine-final-cross/desktop node scripts/capture-photo-walk-placements.mjs
          VIEW_PREFIX=october-28 VIEWPORT_WIDTH=320 VIEWPORT_HEIGHT=568 OUTPUT_DIR=tmp/pine-final-cross/phone node scripts/capture-photo-walk-placements.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pine-final-cross
          path: tmp/pine-final-cross/
          retention-days: 7
      - name: Chromium all pine views and both 320px routes
        run: npx playwright test tests/browser/photo-walk-october-overview.spec.ts tests/browser/photo-walk-pine*.spec.ts
      - name: WebKit all pine views and both 320px routes
        if: always()
        run: npx playwright test --config playwright.webkit.config.ts tests/browser/photo-walk-october-overview.spec.ts tests/browser/photo-walk-pine*.spec.ts
      - name: Production offline traversal
        if: always()
        run: |
          npm run preview -- --host 127.0.0.1 --port 4174 > /tmp/pine-preview.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4174 >/dev/null && break; sleep 1; done
          npm run test:offline
      - name: Pages base-path build
        if: always()
        run: npm run build:pages
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pine-final-browser
          path: |
            tmp/**/*.png
            tmp/**/review-index.json
            tmp/**/error-context.md
          retention-days: 7
